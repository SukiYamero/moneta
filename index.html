<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Default before the theme-resolution script below runs; must exist
         in the DOM before that script does so it can correct this
         synchronously (a module script wouldn't run in time — see below). -->
    <meta name="theme-color" content="#0c0d10" />
    <!--
      Resolves the theme synchronously, before CSS paints anything —
      specs.md §10.30. Must be a classic (non-module) inline script: a
      module script is deferred until the document is parsed, which is
      exactly the delay this exists to avoid. Duplicates three literals
      that can't be imported this early: the localStorage key from
      src/lib/theme.ts's THEME_STORAGE_KEY, the 'oscuro'/'claro' domain
      values from Preferencias['tema'] (src/lib/schema.ts), and
      THEME_COLOR's two hex values (the meta[name=theme-color] this script
      also corrects — otherwise the browser chrome paints dark for a
      light-theme user until React mounts) — themeBootScript.test.ts
      asserts this file stays byte-for-byte in sync with all three.
    -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('kurobello-theme')
        } catch (e) {}
        var tema = stored === 'claro' || stored === 'oscuro' ? stored : 'sistema'
        var dark =
          tema === 'oscuro' ||
          (tema === 'sistema' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0c0d10' : '#f4f3ef')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale/user-scalable disable pinch-zoom; touch-action:
         manipulation in index.css disables double-tap-to-zoom — a
         deliberate accessibility trade-off for a native-feel app whose
         type scale is already rem-based and honors the system font size
         (user decision, 2026-08-24; specs.md §10.34, §11). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Personal finance, stored in your own Google Drive." />
    <title>{{APP_NAME}}</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
